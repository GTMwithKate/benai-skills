<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>Email subject mirror</title>
  <!--[if mso]>
  <xml>
    <o:OfficeDocumentSettings>
      <o:PixelsPerInch>96</o:PixelsPerInch>
    </o:OfficeDocumentSettings>
  </xml>
  <style>
    table, td { border-collapse: collapse; font-family: Helvetica, Arial, sans-serif; }
  </style>
  <![endif]-->
  <style>
    /* Enhancement + responsive layer only. The email must survive this block being deleted. */
    :root { color-scheme: light dark; supported-color-schemes: light dark; }
    body { margin: 0; padding: 0; -webkit-text-size-adjust: 100%; }
    img { border: 0; outline: none; text-decoration: none; }
    a { color: inherit; }

    @media only screen and (max-width: 620px) {
      .container { width: 100% !important; }
      .stack { display: block !important; width: 100% !important; }
      .px-mobile { padding-left: 20px !important; padding-right: 20px !important; }
      .hide-mobile { display: none !important; }
      .btn-full { width: 100% !important; }
    }

    @media (prefers-color-scheme: dark) {
      .dm-bg    { background-color: #111418 !important; }
      .dm-card  { background-color: #1C2128 !important; border-color: #2D333B !important; }
      .dm-text  { color: #E6E8EB !important; }
      .dm-muted { color: #9AA4AF !important; }
    }
  </style>
</head>
<body class="dm-bg" style="margin:0;padding:0;background-color:#F2F3F5;">

  <!-- Preheader: hidden preview text, ~85 chars, then padding characters -->
  <div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">
    Preheader text goes here.
    &#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;
  </div>

  <!-- Full-width canvas -->
  <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" class="dm-bg" style="background-color:#F2F3F5;">
    <tr>
      <td align="center" style="padding:24px 12px;">

        <!--[if mso]>
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" align="center"><tr><td>
        <![endif]-->

        <!-- 600px container -->
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" class="container" style="width:600px;max-width:100%;">

          <!-- Logo bar -->
          <tr>
            <td align="center" style="padding:8px 0 24px 0;">
              <img src="https://example.com/logo.png" width="120" alt="Brand name" style="display:block;width:120px;height:auto;color:#1A1A1A;font-family:Helvetica,Arial,sans-serif;font-size:16px;">
            </td>
          </tr>

          <!-- Card: solid fallback first, gradient/glass tint as enhancement -->
          <tr>
            <td class="dm-card px-mobile" style="background-color:#FFFFFF;background-image:linear-gradient(180deg,#FFFFFF 0%,#F7F8FC 100%);border:1px solid #E4E6EB;border-radius:16px;padding:40px;">

              <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td>
                    <h1 class="dm-text" style="margin:0 0 16px 0;color:#1A1A1A;font-family:Helvetica,Arial,sans-serif;font-size:28px;mso-line-height-rule:exactly;line-height:34px;font-weight:bold;">
                      Headline goes here
                    </h1>
                    <p class="dm-muted" style="margin:0 0 28px 0;color:#4A4F57;font-family:Helvetica,Arial,sans-serif;font-size:16px;mso-line-height-rule:exactly;line-height:24px;">
                      Body copy goes here. Keep paragraphs short. Every style is inline; the head block is enhancement only.
                    </p>
                  </td>
                </tr>

                <!-- Bulletproof button -->
                <tr>
                  <td align="left">
                    <!--[if mso]>
                    <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word"
                      href="https://example.com/cta"
                      style="height:48px;v-text-anchor:middle;width:220px;" arcsize="17%"
                      strokecolor="#1A56DB" fillcolor="#1A56DB">
                      <w:anchorlock/>
                      <center style="color:#FFFFFF;font-family:Helvetica,Arial,sans-serif;font-size:16px;font-weight:bold;">
                        Call to action
                      </center>
                    </v:roundrect>
                    <![endif]-->
                    <!--[if !mso]><!-->
                    <a href="https://example.com/cta" class="btn-full"
                       style="background-color:#1A56DB;border-radius:8px;color:#FFFFFF;display:inline-block;font-family:Helvetica,Arial,sans-serif;font-size:16px;font-weight:bold;mso-line-height-rule:exactly;line-height:48px;text-align:center;text-decoration:none;width:220px;-webkit-text-size-adjust:none;">
                      Call to action
                    </a>
                    <!--<![endif]-->
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- Spacer -->
          <tr><td style="font-size:24px;line-height:24px;height:24px;">&nbsp;</td></tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding:0 20px 32px 20px;">
              <p class="dm-muted" style="margin:0 0 8px 0;color:#8A9099;font-family:Helvetica,Arial,sans-serif;font-size:12px;mso-line-height-rule:exactly;line-height:18px;">
                Company name &middot; Street address &middot; City, Country
              </p>
              <p style="margin:0;font-family:Helvetica,Arial,sans-serif;font-size:12px;mso-line-height-rule:exactly;line-height:18px;">
                <a href="https://example.com/unsubscribe" style="color:#8A9099;text-decoration:underline;">Unsubscribe</a>
                &nbsp;&middot;&nbsp;
                <a href="https://example.com/preferences" style="color:#8A9099;text-decoration:underline;">Preferences</a>
              </p>
            </td>
          </tr>

        </table>

        <!--[if mso]>
        </td></tr></table>
        <![endif]-->

      </td>
    </tr>
  </table>

</body>
</html>
