<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Substance slide</title>
<link rel="stylesheet" href="tokens.css">
<!-- If the brand uses webfonts, add the fonts <link> or @font-face here. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  .slide {
    width: 1080px; height: 1350px;
    background: var(--carousel-bg);
    color: var(--carousel-ink);
    font-family: var(--carousel-font-body);
    display: flex; flex-direction: column;
    padding: var(--carousel-pad);
    padding-bottom: calc(var(--carousel-footer-h) + 48px);
    position: relative; overflow: hidden;
  }
  .eyebrow {
    font-size: 24px; font-weight: 600;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--carousel-muted);
    margin-bottom: 32px;
  }
  h2 {
    font-family: var(--carousel-font-display);
    font-size: 64px; line-height: 1.1; font-weight: 800;
    letter-spacing: -0.01em;
    max-width: 16ch;
    margin-bottom: 56px;
  }
  h2 mark {
    background: var(--carousel-highlight);
    color: inherit;
    border-radius: var(--carousel-radius);
    padding: 0 0.14em;
    box-decoration-break: clone; -webkit-box-decoration-break: clone;
  }
  ol.points { list-style: none; display: flex; flex-direction: column; gap: 44px; counter-reset: pt; }
  ol.points li {
    counter-increment: pt;
    display: flex; align-items: flex-start; gap: 28px;
    font-size: 38px; line-height: 1.35; font-weight: 500;
    max-width: 22ch;
  }
  ol.points li::before {
    content: counter(pt, decimal-leading-zero);
    font-family: var(--carousel-font-display);
    font-size: 34px; font-weight: 800;
    color: var(--carousel-accent);
    line-height: 1.5; flex: none;
  }
  /* For unordered bullets instead of numbered steps, swap ::before content
     for "\2192" (an arrow) or a small accent square. */
  .swipe {
    position: absolute; right: var(--carousel-pad);
    bottom: calc(var(--carousel-footer-h) + 40px);
    font-size: 30px; font-weight: 700;
    color: var(--carousel-accent);
    letter-spacing: 0.08em;
  }
  .footer {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: var(--carousel-footer-h);
    background: var(--carousel-bar);
    color: var(--carousel-bg);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 var(--carousel-pad);
    font-size: 26px; font-weight: 600;
  }
  .footer .identity { display: flex; align-items: center; gap: 20px; }
  .footer img.logo { height: 52px; width: auto; display: block; }
  .footer .page { font-variant-numeric: tabular-nums; letter-spacing: 0.12em; opacity: 0.85; }
</style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow"><!-- EYEBROW: 2-5 words --></div>
    <h2><!-- HEADLINE with exactly one <mark>highlighted phrase</mark> --></h2>
    <ol class="points">
      <li><!-- BULLET/STEP: 3-7 words --></li>
      <li><!-- BULLET/STEP: 3-7 words --></li>
      <li><!-- BULLET/STEP: 3-7 words (2-4 items total) --></li>
    </ol>
    <div class="swipe">&#8594;</div>
    <div class="footer">
      <div class="identity">
        <!-- Optional: <img class="logo" src="RELATIVE/PATH/mark.svg" alt=""> -->
        <span><!-- BRAND OR AUTHOR NAME --></span>
      </div>
      <div class="page"><!-- NN / NN --></div>
    </div>
  </div>
</body>
</html>
